<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini GTA 3D - Three.js</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Arial', sans-serif; }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            pointer-events: none;
            user-select: none;
            z-index: 100;
            border-left: 4px solid #ffaa00;
        }
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.6);
            color: #fff;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            pointer-events: none;
            z-index: 100;
            backdrop-filter: blur(5px);
        }
        #controls kbd {
            background: #333;
            border-radius: 4px;
            padding: 2px 8px;
            margin: 0 2px;
            border: 1px solid #555;
        }
        #speed {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            color: #0f0;
            padding: 10px 20px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 24px;
            font-weight: bold;
            z-index: 100;
            border: 1px solid #0f0;
            box-shadow: 0 0 20px rgba(0,255,0,0.3);
        }
    </style>
</head>
<body>
    <div id="info">
        <h2>🚗 MINI GTA 3D</h2>
        <p>Di chuyển tự do - Lái xe - Khám phá thành phố</p>
    </div>
    <div id="controls">
        <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> Di chuyển / Lái xe &nbsp; | &nbsp;
        <kbd>Space</kbd> Nhảy / Phanh &nbsp; | &nbsp;
        <kbd>E</kbd> Vào / Ra xe &nbsp; | &nbsp;
        <kbd>Mouse</kbd> Xoay camera
    </div>
    <div id="speed">0 km/h</div>

    <!-- Import Three.js và các module bổ trợ -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // --- Cấu hình cơ bản ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // Bầu trời xanh
        scene.fog = new THREE.Fog(0x87CEEB, 100, 300);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(15, 10, 20);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // --- Ánh sáng ---
        // Ánh sáng môi trường
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);

        // Ánh sáng mặt trời (Directional)
        const sunLight = new THREE.DirectionalLight(0xffeedd, 1);
        sunLight.position.set(50, 80, 30);
        sunLight.castShadow = true;
        sunLight.receiveShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        const d = 100;
        sunLight.shadow.camera.left = -d;
        sunLight.shadow.camera.right = d;
        sunLight.shadow.camera.top = d;
        sunLight.shadow.camera.bottom = -d;
        sunLight.shadow.camera.near = 1;
        sunLight.shadow.camera.far = 200;
        scene.add(sunLight);

        // Thêm một chút ánh sáng phụ
        const fillLight = new THREE.PointLight(0x4466ff, 0.3);
        fillLight.position.set(-20, 20, 20);
        scene.add(fillLight);

        // --- Mặt đất (Grass/Asphalt) ---
        const groundGeometry = new THREE.PlaneGeometry(300, 300);
        const groundMaterial = new THREE.MeshStandardMaterial({ color: 0x2a5c2a, roughness: 0.8, metalness: 0.2 });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Lưới đường phố (đơn giản)
        const gridHelper = new THREE.GridHelper(300, 60, 0x888888, 0x444444);
        gridHelper.position.y = 0.01;
        scene.add(gridHelper);

        // --- Tạo thành phố với các tòa nhà ---
        function createBuilding(x, z, width, depth, height, color) {
            const geometry = new THREE.BoxGeometry(width, height, depth);
            const material = new THREE.MeshStandardMaterial({ color: color, roughness: 0.4, metalness: 0.1 });
            const building = new THREE.Mesh(geometry, material);
            building.position.set(x, height / 2, z);
            building.castShadow = true;
            building.receiveShadow = true;
            scene.add(building);

            // Cửa sổ (tạo cảm giác)
            const windowMat = new THREE.MeshStandardMaterial({ color: 0xffffaa, emissive: 0x442200 });
            const windowGeo = new THREE.BoxGeometry(0.6, 0.6, 0.1);
            for (let i = 0; i < Math.floor(height / 3); i++) {
                for (let j = -1; j <= 1; j++) {
                    if (Math.random() > 0.3) {
                        const windowMesh = new THREE.Mesh(windowGeo, windowMat);
                        windowMesh.position.set(x + j * (width / 3), 2 + i * 3, z + depth / 2 + 0.05);
                        scene.add(windowMesh);
                        const windowMesh2 = windowMesh.clone();
                        windowMesh2.position.z = z - depth / 2 - 0.05;
                        scene.add(windowMesh2);
                    }
                }
            }
            return building;
        }

        // Tạo các tòa nhà ngẫu nhiên
        const buildingPositions = [];
        const colors = [0x8B4513, 0xA0522D, 0xCD853F, 0xDEB887, 0x5C4033, 0x3E2723, 0x1A237E, 0x283593, 0x4A148C, 0x880E4F, 0xB71C1C];
        for (let i = 0; i < 120; i++) {
            let x = (Math.random() - 0.5) * 180;
            let z = (Math.random() - 0.5) * 180;
            // Giữ khoảng trống cho đường đi
            if (Math.abs(x % 20) < 5 || Math.abs(z % 20) < 5) {
                // Đảm bảo không xây giữa đường
                if (Math.random() > 0.7) {
                    x += 8 * Math.sign(x || 1);
                    z += 8 * Math.sign(z || 1);
                } else {
                    continue;
                }
            }
            // Kiểm tra khoảng cách với nhân vật
            if (Math.sqrt(x*x + z*z) < 15) continue;
            
            const w = 4 + Math.random() * 6;
            const d = 4 + Math.random() * 6;
            const h = 6 + Math.random() * 20;
            const color = colors[Math.floor(Math.random() * colors.length)];
            createBuilding(x, z, w, d, h, color);
            buildingPositions.push({ x, z, w, d, h });
        }

        // Thêm vài cây xanh
        function createTree(x, z) {
            const trunkGeo = new THREE.CylinderGeometry(0.4, 0.6, 3);
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5D4037 });
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.set(x, 1.5, z);
            trunk.castShadow = true;
            trunk.receiveShadow = true;
            scene.add(trunk);

            const leafGeo = new THREE.ConeGeometry(2, 4, 8);
            const leafMat = new THREE.MeshStandardMaterial({ color: 0x2E7D32 });
            const leaf = new THREE.Mesh(leafGeo, leafMat);
            leaf.position.set(x, 4.5, z);
            leaf.castShadow = true;
            leaf.receiveShadow = true;
            scene.add(leaf);
        }

        for (let i = 0; i < 40; i++) {
            let x = (Math.random() - 0.5) * 180;
            let z = (Math.random() - 0.5) * 180;
            if (Math.sqrt(x*x + z*z) < 12) continue;
            if (Math.abs(x % 20) < 3 && Math.abs(z % 20) < 3) continue; // tránh đường
            createTree(x, z);
        }

        // --- Tạo nhân vật (Player) ---
        const playerGroup = new THREE.Group();
        
        // Thân
        const bodyGeo = new THREE.BoxGeometry(1.2, 2, 0.8);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x2196F3 });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 1;
        body.castShadow = true;
        body.receiveShadow = true;
        playerGroup.add(body);

        // Đầu
        const headGeo = new THREE.SphereGeometry(0.6, 16, 16);
        const headMat = new THREE.MeshStandardMaterial({ color: 0xFFCCAA });
        const head = new THREE.Mesh(headGeo, headMat);
        head.position.y = 2.3;
        head.castShadow = true;
        head.receiveShadow = true;
        playerGroup.add(head);

        // Mũ
        const hatGeo = new THREE.ConeGeometry(0.7, 0.5, 8);
        const hatMat = new THREE.MeshStandardMaterial({ color: 0xDD3333 });
        const hat = new THREE.Mesh(hatGeo, hatMat);
        hat.position.y = 2.9;
        hat.castShadow = true;
        playerGroup.add(hat);

        // Tay
        const armGeo = new THREE.BoxGeometry(0.4, 1.2, 0.4);
        const armMat = new THREE.MeshStandardMaterial({ color: 0x1976D2 });
        const leftArm = new THREE.Mesh(armGeo, armMat);
        leftArm.position.set(-0.9, 1.5, 0);
        leftArm.castShadow = true;
        playerGroup.add(leftArm);
        const rightArm = new THREE.Mesh(armGeo, armMat);
        rightArm.position.set(0.9, 1.5, 0);
        rightArm.castShadow = true;
        playerGroup.add(rightArm);

        // Chân
        const legGeo = new THREE.BoxGeometry(0.5, 1.2, 0.5);
        const legMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
        const leftLeg = new THREE.Mesh(legGeo, legMat);
        leftLeg.position.set(-0.4, 0.6, 0);
        leftLeg.castShadow = true;
        playerGroup.add(leftLeg);
        const rightLeg = new THREE.Mesh(legGeo, legMat);
        rightLeg.position.set(0.4, 0.6, 0);
        rightLeg.castShadow = true;
        playerGroup.add(rightLeg);

        playerGroup.position.set(0, 0, 0);
        scene.add(playerGroup);

        // --- Tạo xe hơi ---
        const carGroup = new THREE.Group();
        
        // Thân xe
        const carBodyGeo = new THREE.BoxGeometry(2.5, 0.8, 4.5);
        const carBodyMat = new THREE.MeshStandardMaterial({ color: 0xFF5722, roughness: 0.3, metalness: 0.6 });
        const carBody = new THREE.Mesh(carBodyGeo, carBodyMat);
        carBody.position.y = 0.8;
        carBody.castShadow = true;
        carBody.receiveShadow = true;
        carGroup.add(carBody);

        // Cabin
        const cabinGeo = new THREE.BoxGeometry(1.8, 0.7, 2);
        const cabinMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.2, metalness: 0.8 });
        const cabin = new THREE.Mesh(cabinGeo, cabinMat);
        cabin.position.set(0, 1.5, -0.2);
        cabin.castShadow = true;
        cabin.receiveShadow = true;
        carGroup.add(cabin);

        // Kính
        const glassMat = new THREE.MeshStandardMaterial({ color: 0x88CCFF, transparent: true, opacity: 0.5, roughness: 0.1, metalness: 0.9 });
        const glassGeo = new THREE.BoxGeometry(1.6, 0.5, 1.8);
        const glass = new THREE.Mesh(glassGeo, glassMat);
        glass.position.set(0, 1.5, -0.2);
        carGroup.add(glass);

        // Bánh xe
        const wheelGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.4, 16);
        const wheelMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.9 });
        const wheelPositions = [
            [-1.3, 0.5, 1.4], [1.3, 0.5, 1.4],
            [-1.3, 0.5, -1.4], [1.3, 0.5, -1.4]
        ];
        wheelPositions.forEach(pos => {
            const wheel = new THREE.Mesh(wheelGeo, wheelMat);
            wheel.rotation.z = Math.PI / 2;
            wheel.position.set(pos[0], pos[1], pos[2]);
            wheel.castShadow = true;
            wheel.receiveShadow = true;
            carGroup.add(wheel);
        });

        carGroup.position.set(5, 0, 5);
        carGroup.rotation.y = 0.5;
        scene.add(carGroup);

        // --- Biển báo / Đồ vật trang trí ---
        // Thêm vài cột đèn
        for (let i = 0; i < 15; i++) {
            const poleGeo = new THREE.CylinderGeometry(0.1, 0.1, 4);
            const poleMat = new THREE.MeshStandardMaterial({ color: 0x888888 });
            const pole = new THREE.Mesh(poleGeo, poleMat);
            const angle = (i / 15) * Math.PI * 2;
            const radius = 25;
            pole.position.set(Math.cos(angle) * radius, 2, Math.sin(angle) * radius);
            pole.castShadow = true;
            pole.receiveShadow = true;
            scene.add(pole);
            
            const lampGeo = new THREE.SphereGeometry(0.3);
            const lampMat = new THREE.MeshStandardMaterial({ color: 0xFFFF00, emissive: 0xFFAA00 });
            const lamp = new THREE.Mesh(lampGeo, lampMat);
            lamp.position.set(Math.cos(angle) * radius, 4.2, Math.sin(angle) * radius);
            scene.add(lamp);
        }

        // --- Điều khiển ---
        const keys = {
            w: false, a: false, s: false, d: false, space: false, e: false
        };

        window.addEventListener('keydown', (e) => {
            switch(e.code) {
                case 'KeyW': keys.w = true; e.preventDefault(); break;
                case 'KeyA': keys.a = true; e.preventDefault(); break;
                case 'KeyS': keys.s = true; e.preventDefault(); break;
                case 'KeyD': keys.d = true; e.preventDefault(); break;
                case 'Space': keys.space = true; e.preventDefault(); break;
                case 'KeyE': keys.e = true; e.preventDefault(); break;
            }
        });

        window.addEventListener('keyup', (e) => {
            switch(e.code) {
                case 'KeyW': keys.w = false; e.preventDefault(); break;
                case 'KeyA': keys.a = false; e.preventDefault(); break;
                case 'KeyS': keys.s = false; e.preventDefault(); break;
                case 'KeyD': keys.d = false; e.preventDefault(); break;
                case 'Space': keys.space = false; e.preventDefault(); break;
                case 'KeyE': keys.e = false; e.preventDefault(); break;
            }
        });

        // --- Trạng thái game ---
        let inCar = false;
        let carSpeed = 0;
        const maxCarSpeed = 25;
        const carAcceleration = 15;
        const carDeceleration = 10;
        let playerSpeed = 8;
        let playerVelocity = new THREE.Vector3();
        let isJumping = false;
        let jumpVelocity = 0;
        const gravity = 30;
        let playerY = 0;
        
        // Xoay camera bằng chuột (dùng OrbitControls nhưng giới hạn)
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 2, 0);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2.2;
        controls.minDistance = 5;
        controls.maxDistance = 25;
        controls.enablePan = false;
        controls.autoRotate = false;

        // Cập nhật speed display
        const speedDisplay = document.getElementById('speed');

        // --- Hàm kiểm tra va chạm với tòa nhà (đơn giản) ---
        function checkCollision(newPos, radius = 1.2) {
            for (let b of buildingPositions) {
                const dx = Math.abs(newPos.x - b.x);
                const dz = Math.abs(newPos.z - b.z);
                const halfW = b.w / 2 + radius;
                const halfD = b.d / 2 + radius;
                if (dx < halfW && dz < halfD) {
                    return true;
                }
            }
            return false;
        }

        // --- Animation Loop ---
        let clock = new THREE.Clock();

        function animate() {
            const delta = Math.min(clock.getDelta(), 0.1);
            
            // --- Cập nhật logic ---
            if (!inCar) {
                // Di chuyển nhân vật (Top-down style)
                const moveDir = new THREE.Vector3(0, 0, 0);
                if (keys.w) moveDir.z -= 1;
                if (keys.s) moveDir.z += 1;
                if (keys.a) moveDir.x -= 1;
                if (keys.d) moveDir.x += 1;

                if (moveDir.length() > 0) {
                    moveDir.normalize();
                    // Xoay nhân vật theo hướng di chuyển
                    const angle = Math.atan2(moveDir.x, moveDir.z);
                    playerGroup.rotation.y = angle;
                    
                    const speed = playerSpeed * delta;
                    const newX = playerGroup.position.x + moveDir.x * speed;
                    const newZ = playerGroup.position.z + moveDir.z * speed;
                    
                    // Kiểm tra va chạm
                    if (!checkCollision({x: newX, z: newZ})) {
                        playerGroup.position.x = newX;
                        playerGroup.position.z = newZ;
                    }
                }

                // Nhảy
                if (keys.space && !isJumping) {
                    isJumping = true;
                    jumpVelocity = 10;
                }

                if (isJumping) {
                    playerY += jumpVelocity * delta;
                    jumpVelocity -= gravity * delta;
                    if (playerY <= 0) {
                        playerY = 0;
                        isJumping = false;
                        jumpVelocity = 0;
                    }
                }
                playerGroup.position.y = playerY;

                // Vào xe
                if (keys.e) {
                    const distToCar = playerGroup.position.distanceTo(carGroup.position);
                    if (distToCar < 4) {
                        inCar = true;
                        keys.e = false;
                        // Đặt nhân vật vào trong xe (ẩn đi)
                        playerGroup.visible = false;
                        carSpeed = 0;
                    }
                }

                // Cập nhật camera theo nhân vật
                controls.target.copy(playerGroup.position).add(new THREE.Vector3(0, 2, 0));
                // Vị trí camera tương đối
                const camOffset = new THREE.Vector3(8, 8, 8);
                camera.position.copy(playerGroup.position).add(camOffset);
                controls.update();
            } else {
                // --- Điều khiển xe ---
                // Tăng tốc / Phanh
                if (keys.w) {
                    carSpeed += carAcceleration * delta;
                    if (carSpeed > maxCarSpeed) carSpeed = maxCarSpeed;
                } else if (keys.s) {
                    carSpeed -= carAcceleration * delta;
                    if (carSpeed < -maxCarSpeed/2) carSpeed = -maxCarSpeed/2;
                } else {
                    // Ma sát
                    if (carSpeed > 0) {
                        carSpeed -= carDeceleration * delta;
                        if (carSpeed < 0) carSpeed = 0;
                    } else if (carSpeed < 0) {
                        carSpeed += carDeceleration * delta;
                        if (carSpeed > 0) carSpeed = 0;
                    }
                }

                // Phanh tay
                if (keys.space) {
                    if (carSpeed > 0) carSpeed = Math.max(0, carSpeed - 20 * delta);
                    if (carSpeed <
